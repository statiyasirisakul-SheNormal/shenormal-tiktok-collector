name: She & Normal TikTok Collector

on:
  schedule:
    - cron: '0 23 * * 0'   # 06:00 น. เวลาไทย (UTC+7) ทุกวันอาทิตย์ — ตรงกับที่ตั้งไว้ในหลังบ้าน
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run TikTok collector
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INTEL_ADMIN_KEY:   ${{ secrets.INTEL_ADMIN_KEY }}
          LINE_TOKEN:        ${{ secrets.LINE_TOKEN }}
          LINE_TARGETS:      ${{ secrets.LINE_TARGETS }}
        run: python tiktok_collector.py
