name: She & Normal TikTok Collector

# ปิดรอบอัตโนมัติแล้ว (7/10/69): TikTok บล็อกการเปิดหน้าโปรไฟล์ → ได้แค่ยอดผู้ติดตาม ไม่ได้คลิปใหม่
# ระบบใหม่ = Supabase Edge Function competitor-sync (Apify ทุก 2 วัน) อยู่ใน repo she-normal-dashboard
# เก็บไฟล์นี้ไว้กดรันเองได้ถ้าจำเป็น
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run TikTok collector
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INTEL_ADMIN_KEY:   ${{ secrets.INTEL_ADMIN_KEY }}
          LINE_TOKEN:        ${{ secrets.LINE_TOKEN }}
          LINE_TARGETS:      ${{ secrets.LINE_TARGETS }}
        run: python tiktok_collector.py
