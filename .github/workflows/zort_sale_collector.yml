name: She & Normal Zort Sales Collector

# ปิดรอบอัตโนมัติ 31/10/69 — ย้ายไป Edge Function `zort` ใน Supabase (ดึงทุกชั่วโมง คีย์กรอกในหลังบ้าน Dashboard)
# เหลือปุ่มกดรันเองไว้เป็นทางสำรอง
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Zort sales collector (She)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INTEL_ADMIN_KEY:   ${{ secrets.INTEL_ADMIN_KEY }}
          ZORT_STORENAME:    ${{ secrets.ZORT_STORENAME }}
          ZORT_APIKEY:       ${{ secrets.ZORT_APIKEY }}
          ZORT_APISECRET:    ${{ secrets.ZORT_APISECRET }}
        run: python zort_sales_collector.py
