name: She & Normal Zort Sales Collector

on:
  schedule:
    - cron: '30 0 * * *'   # 07:30 น. เวลาไทย (UTC+7) ทุกวัน
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Zort sales collector (She)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INTEL_ADMIN_KEY:   ${{ secrets.INTEL_ADMIN_KEY }}
          ZORT_STORENAME:    ${{ secrets.ZORT_STORENAME }}
          ZORT_APIKEY:       ${{ secrets.ZORT_APIKEY }}
          ZORT_APISECRET:    ${{ secrets.ZORT_APISECRET }}
        run: python zort_sales_collector.py
